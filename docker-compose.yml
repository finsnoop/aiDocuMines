# aiDocuMines API stack.
#
# Staying up on a small server:
#   * every container has a memory cap (mem_limit). When one service runs away, the kernel
#     stops THAT container, Docker starts it again (restart: unless-stopped), and the other
#     services are not touched. Without caps the whole server ran out of memory and the
#     kernel killed containers at random, including the database.
#   * health checks are cheap and honest; deploy/watchdog.sh (installed as a systemd timer by
#     deploy/install-watchdog.sh) restarts anything unhealthy or stopped.
#   * caps and worker counts are tunable in .env (see .env.example, "Capacity").
services:
  aidocumines_api_layer_database:
    build: {context: ., dockerfile: deploy/Dockerfile.postgres}
    image: aidocumines-postgres-tls:15
    container_name: aidocumines_api_layer_db
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-2g}
    shm_size: 256m
    stop_grace_period: 1m
    oom_score_adj: -500        # the database is the last thing the kernel should stop
    logging: &logging { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - postgres_tls:/var/lib/postgresql/tls
      - postgres_ca:/var/lib/postgresql/ca
    env_file:
      - .env
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h aidocumines_api_layer_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  # Redis is the task queue and the cache.
  #   * REDIS_PASSWORD (set it in .env): Redis has no published port, but it sits on a network
  #     shared with other apps; without a password any of them could read or empty the queue.
  #   * maxmemory + volatile-lru: cached data and old results (which have an expiry) are
  #     dropped first under pressure; queued tasks (no expiry) are never dropped silently.
  #   * the queue is kept on a volume, so it also survives the container being recreated.
  redis:
    image: redis:7-alpine
    container_name: aidocumines_redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-1g}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --save 300 10 --loglevel warning --protected-mode no
        --maxmemory ${REDIS_MAXMEMORY:-768mb} --maxmemory-policy volatile-lru
        --tcp-keepalive 60 --timeout 0
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis_data:/data
    networks: [captain-overlay-network]
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis_watchdog:
    image: python:3.11-slim
    container_name: aidocumines_redis_watchdog
    restart: unless-stopped
    mem_limit: 128m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    logging: *logging
    depends_on:
      redis: { condition: service_healthy }
    command: >
      sh -c "pip install redis && python /watchdog/redis_watchdog.py"
    volumes:
      - ./redis_watchdog:/watchdog
    networks: [captain-overlay-network]


  ollama:
    image: ollama/ollama:latest          # pin latest or a specific version
    container_name: aidocumines_ollama
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    # Local models run on the CPU: cap them so the web app, OnlyOffice and other apps keep cores free.
    cpus: ${OLLAMA_CPUS:-2}
    logging: *logging
    ports: ["127.0.0.1:11435:11434"]
    environment:
      # bind to localhost unless you *need* LAN/Internet access
      # if you need LAN: use 0.0.0.0:11434 and protect with a reverse proxy / firewall
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama-data:/root/.ollama
    networks: [captain-overlay-network]
    healthcheck:
      # use the built-in ollama client; no curl/wget needed
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

        #  ollama:
        # image: ollama/ollama
        # container_name: aidocumines_ollama
        # restart: unless-stopped
        # ports: ["127.0.0.1:11434:11434"]
        # volumes:
        # - ollama-data:/root/.ollama
        # networks: [captain-overlay-network]
        # healthcheck:
        # test: ["CMD", "curl", "-f", "http://localhost:11434"]
        # interval: 10s
        # timeout: 5s
        # retries: 3

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: aidocumines_litellm
    restart: unless-stopped
    mem_limit: ${LITELLM_MEM_LIMIT:-1536m}   # one worker uses ~1 GB with several vendor catalogues loaded
    logging: *logging
    # One worker is plenty for forwarding requests (async); each extra one costs ~450 MB.
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "${LITELLM_WORKERS:-1}"]
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # Optional vendor keys (litellm/config.yaml): a vendor's models appear once its key is set
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db_prepare:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_db_prepare
    command: /app/entrypoint.sh
    depends_on:
      aidocumines_api_layer_database: { condition: service_healthy }
    volumes: [".:/app", "postgres_ca:/run/pg-ca:ro"]
    env_file: [".env"]
    environment: { SERVICE_NAME: db_prepare, POSTGRES_SSLMODE: verify-full, POSTGRES_SSLROOTCERT: /run/pg-ca/server.crt }
    networks: [captain-overlay-network]

  web:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_web
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-3g}
    stop_grace_period: 40s
    logging: *logging
    command: /app/entrypoint.sh
    volumes:
      - .:/app
      - postgres_ca:/run/pg-ca:ro
      - ./media:/app/media
      - ./static:/app/static
    env_file: [".env"]
    environment:
      SERVICE_NAME: web
      # gunicorn reuses a fixed pool of threads, so connections can be kept (seconds).
      POSTGRES_CONN_MAX_AGE: "60"
      POSTGRES_SSLMODE: verify-full
      POSTGRES_SSLROOTCERT: /run/pg-ca/server.crt
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      # Own Redis by container name: on the shared CapRover network "redis" can be another app's.
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 8 http://127.0.0.1:8020/api/v1/health/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 4
      start_period: 180s

  celery:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_celery
    restart: unless-stopped
    mem_limit: ${CELERY_MEM_LIMIT:-6g}
    # Long document jobs (OCR, agents) must not take every core from interactive requests.
    cpus: ${CELERY_CPUS:-2}
    stop_grace_period: 2m
    logging: *logging
    command: /app/entrypoint.sh
    volumes: [".:/app", "postgres_ca:/run/pg-ca:ro"]
    env_file: [".env"]
    environment:
      SERVICE_NAME: celery
      POSTGRES_SSLMODE: verify-full
      POSTGRES_SSLROOTCERT: /run/pg-ca/server.crt
      # Long-running document work only. Short interactive work goes to celery_fast.
      CELERY_QUEUES: ai_documines
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      # Own Redis by container name: on the shared CapRover network "redis" can be another app's.
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/celery_worker_alive -mmin -2 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 300s

  # Fast lane: emails, sign-in codes, chat answers people are waiting for, file moves.
  # It has its own worker so it is never stuck behind hours of OCR or translation.
  celery_fast:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_celery_fast
    restart: unless-stopped
    mem_limit: ${CELERY_FAST_MEM_LIMIT:-3g}
    stop_grace_period: 1m
    logging: *logging
    command: /app/entrypoint.sh
    volumes: [".:/app", "postgres_ca:/run/pg-ca:ro"]
    env_file: [".env"]
    environment:
      SERVICE_NAME: celery
      POSTGRES_SSLMODE: verify-full
      POSTGRES_SSLROOTCERT: /run/pg-ca/server.crt
      CELERY_QUEUES: ai_documines_fast
      CELERY_POOL: threads
      CELERY_CONCURRENCY: ${CELERY_FAST_CONCURRENCY:-8}
      CELERY_WORKER_NAME: fast
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/celery_worker_alive -mmin -2 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 300s

  celery_beat:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_celery_beat
    restart: unless-stopped
    mem_limit: ${BEAT_MEM_LIMIT:-1g}
    logging: *logging
    command: /app/entrypoint.sh
    volumes: [".:/app", "postgres_ca:/run/pg-ca:ro"]
    env_file: [".env"]
    environment:
      SERVICE_NAME: celery_beat
      POSTGRES_SSLMODE: verify-full
      POSTGRES_SSLROOTCERT: /run/pg-ca/server.crt
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      # Own Redis by container name: on the shared CapRover network "redis" can be another app's.
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 180s

  file_monitor:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_file_monitor
    restart: unless-stopped
    mem_limit: ${FILE_MONITOR_MEM_LIMIT:-1500m}
    logging: *logging
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    volumes:
      - .:/app
      - postgres_ca:/run/pg-ca:ro
      - ./media:/app/media
      - ./logs/supervisor:/var/log
    env_file: [".env"]
    environment:
      SERVICE_NAME: file_monitor
      POSTGRES_SSLMODE: verify-full
      POSTGRES_SSLROOTCERT: /run/pg-ca/server.crt
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      # Own Redis by container name: on the shared CapRover network "redis" can be another app's.
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
    networks: [captain-overlay-network]

  # Keep the existing embedded-etcd member directory, but run the SAME etcd
  # version separately so leader election finishes before Milvus initializes
  # sessions. Run deploy/prepare-milvus-etcd.sh before applying this
  # migration to an existing deployment. Never start both metadata writers.
  milvus_etcd:
    image: quay.io/coreos/etcd:v3.5.23
    container_name: aidocumines_milvus_etcd
    restart: unless-stopped
    mem_limit: ${MILVUS_ETCD_MEM_LIMIT:-512m}
    logging: *logging
    command:
      - etcd
      - --name=default
      - --data-dir=/var/lib/milvus/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://milvus_etcd:2379
      - --listen-peer-urls=http://localhost:2380
      - --initial-advertise-peer-urls=http://localhost:2380
      - --initial-cluster=default=http://localhost:2380
      - --quota-backend-bytes=4294967296
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
    volumes:
      - milvus-data:/var/lib/milvus
    networks: [milvus-metadata]
    healthcheck:
      test: [CMD, etcdctl, --endpoints=http://127.0.0.1:2379, --command-timeout=5s, endpoint, health]
      interval: 5s
      timeout: 8s
      start_period: 20s
      retries: 20

  # Vector/RocksMQ/local storage and the Milvus image stay unchanged. Metadata
  # has no host ports and is isolated from the shared CapRover network.
  milvus:
    image: milvusdb/milvus:v2.6.17
    container_name: aidocumines_milvus
    entrypoint: [/tini, --, /bin/sh, /milvus/wait-for-etcd.sh]
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    mem_limit: ${MILVUS_MEM_LIMIT:-4g}
    logging: *logging
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: milvus_etcd:2379
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
      - ./deploy/milvus/wait-for-etcd.sh:/milvus/wait-for-etcd.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 10
    depends_on:
      milvus_etcd: { condition: service_healthy }
    networks: [captain-overlay-network, milvus-metadata]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    container_name: aidocumines_elasticsearch
    mem_limit: ${ES_MEM_LIMIT:-2g}
    logging: *logging
    environment:
      - discovery.type=single-node
      # Fixed heap (half the container cap): without it Elasticsearch sizes itself from the
      # whole server's memory.
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?Set ELASTICSEARCH_PASSWORD in .env}
      - xpack.security.enabled=true
    ports: ["127.0.0.1:9200:9200", "127.0.0.1:9300:9300"]
    volumes: [ "elasticsearch8_data:/usr/share/elasticsearch/data" ]
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS -u "elastic:$$ELASTIC_PASSWORD" "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ============================
  # ONLYOFFICE (merged here)
  # ============================
  onlyoffice_postgres:
    image: postgres:13
    container_name: onlyoffice-db
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    environment:
      POSTGRES_DB:       ${OO_POSTGRES_DB}
      POSTGRES_USER:     ${OO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OO_POSTGRES_PASSWORD}
    volumes:
      - onlyoffice_postgresql:/var/lib/postgresql/data
    healthcheck:
      # test: ["CMD", "pg_isready", "-U", "${OO_POSTGRES_USER}"]
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [captain-overlay-network]

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    mem_limit: ${ONLYOFFICE_MEM_LIMIT:-3g}
    logging: *logging
    # Expose if you want public access directly; otherwise omit and reverse-proxy elsewhere.
    ports: ["127.0.0.1:8085:80"]
    environment:
      # JWT – exact same secret as Django via .env
      JWT_ENABLED: "true"
      JWT_SECRET:  "${ONLYOFFICE_JWT_SECRET}"
      JWT_HEADER:  "Authorization"
      JWT_IN_BODY: "true"

      # Use the dedicated OO DB
      DB_TYPE: "postgres"
      DB_HOST: "onlyoffice_postgres"
      DB_NAME: "${OO_POSTGRES_DB}"
      DB_USER: "${OO_POSTGRES_USER}"
      DB_PWD:  "${OO_POSTGRES_PASSWORD}"

      # Optional behind TLS terminators/proxies
      ONLYOFFICE_HTTPS_HSTS_ENABLED: "false"
      ONLYOFFICE_HTTPS_CHECK_CERTIFICATE: "false"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    depends_on:
      onlyoffice_postgres: { condition: service_healthy }
    networks: [captain-overlay-network]

volumes:
  postgres_tls:
  postgres_ca:
  elasticsearch8_data:
  postgres_data:
  redis_data:
  ollama-data:
  milvus-data:
  elasticsearch_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_postgresql:

networks:
  milvus-metadata:
    internal: true
  captain-overlay-network:
    external: true


# Keep the old 7.x data volume for rollback; reindex into this new 8.x volume.
