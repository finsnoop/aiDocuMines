services:
  aidocumines_api_layer_database:
    image: postgres:15
    container_name: aidocumines_api_layer_db
    restart: unless-stopped
    user: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    env_file:
      - .env
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h aidocumines_api_layer_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  redis:
    image: redis:alpine
    container_name: aidocumines_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel warning --protected-mode no
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis_watchdog:
    image: python:3.11-slim
    container_name: aidocumines_redis_watchdog
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    command: >
      sh -c "pip install redis && python /watchdog/redis_watchdog.py"
    volumes:
      - ./redis_watchdog:/watchdog
    networks: [captain-overlay-network]


  ollama:
    image: ollama/ollama:latest          # pin latest or a specific version
    container_name: aidocumines_ollama
    restart: unless-stopped
    ports: ["127.0.0.1:11435:11434"]
    environment:
      # bind to localhost unless you *need* LAN/Internet access
      # if you need LAN: use 0.0.0.0:11434 and protect with a reverse proxy / firewall
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    networks: [captain-overlay-network]
    healthcheck:
      # use the built-in ollama client; no curl/wget needed
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

        #  ollama:
        # image: ollama/ollama
        # container_name: aidocumines_ollama
        # restart: unless-stopped
        # ports: ["127.0.0.1:11434:11434"]
        # volumes:
        # - ollama-data:/root/.ollama
        # networks: [captain-overlay-network]
        # healthcheck:
        # test: ["CMD", "curl", "-f", "http://localhost:11434"]
        # interval: 10s
        # timeout: 5s
        # retries: 3

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: aidocumines_litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db_prepare:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_db_prepare
    command: /app/entrypoint.sh
    depends_on:
      aidocumines_api_layer_database: { condition: service_healthy }
    volumes: [".:/app"]
    env_file: [".env"]
    environment: { SERVICE_NAME: db_prepare }
    networks: [captain-overlay-network]

  web:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_web
    restart: unless-stopped
    command: /app/entrypoint.sh
    volumes:
      - .:/app
      - ./media:/app/media
      - ./static:/app/static
    env_file: [".env"]
    environment:
      SERVICE_NAME: web
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      # Own Redis by container name: on the shared CapRover network "redis" can be another app's.
      CELERY_BROKER_URL: redis://aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://aidocumines_redis:6379/0
      REDIS_URL: redis://aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:8020/api/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_celery
    restart: unless-stopped
    command: /app/entrypoint.sh
    volumes: [".:/app"]
    env_file: [".env"]
    environment:
      SERVICE_NAME: celery
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      # Own Redis by container name: on the shared CapRover network "redis" can be another app's.
      CELERY_BROKER_URL: redis://aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://aidocumines_redis:6379/0
      REDIS_URL: redis://aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "celery -A aiDocuMines inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  celery_beat:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_celery_beat
    restart: unless-stopped
    command: /app/entrypoint.sh
    volumes: [".:/app"]
    env_file: [".env"]
    environment:
      SERVICE_NAME: celery_beat
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      # Own Redis by container name: on the shared CapRover network "redis" can be another app's.
      CELERY_BROKER_URL: redis://aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://aidocumines_redis:6379/0
      REDIS_URL: redis://aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD-SHELL", "celery -A aiDocuMines inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  file_monitor:
    build: { context: ., dockerfile: Dockerfile }
    image: aidocumines-app:latest
    container_name: aidocumines_file_monitor
    restart: unless-stopped
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    volumes:
      - .:/app
      - ./media:/app/media
      - ./logs/supervisor:/var/log
    env_file: [".env"]
    environment:
      SERVICE_NAME: file_monitor
      MILVUS_HOST: aidocumines_milvus
      MILVUS_PORT: 19530
      # Own Redis by container name: on the shared CapRover network "redis" can be another app's.
      CELERY_BROKER_URL: redis://aidocumines_redis:6379/0
      CELERY_RESULT_BACKEND: redis://aidocumines_redis:6379/0
      REDIS_URL: redis://aidocumines_redis:6379/1
    depends_on:
      db_prepare: { condition: service_completed_successfully }
    networks: [captain-overlay-network]

  # Milvus standalone with its own embedded etcd and local disk storage: one container,
  # no MinIO (its Docker Hub images are no longer published). Data lives in milvus-data.
  milvus:
    image: milvusdb/milvus:v2.6.17
    container_name: aidocumines_milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
      - ./deploy/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 10
    networks: [captain-overlay-network]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.0
    container_name: aidocumines_elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=changeme
    ports: ["127.0.0.1:9200:9200", "127.0.0.1:9300:9300"]
    volumes: [ "elasticsearch_data:/usr/share/elasticsearch/data" ]
    networks: [captain-overlay-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=90s"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ============================
  # ONLYOFFICE (merged here)
  # ============================
  onlyoffice_postgres:
    image: postgres:13
    container_name: onlyoffice-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${OO_POSTGRES_DB}
      POSTGRES_USER:     ${OO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OO_POSTGRES_PASSWORD}
    volumes:
      - onlyoffice_postgresql:/var/lib/postgresql/data
    healthcheck:
      # test: ["CMD", "pg_isready", "-U", "${OO_POSTGRES_USER}"]
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [captain-overlay-network]

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    # Expose if you want public access directly; otherwise omit and reverse-proxy elsewhere.
    ports: ["127.0.0.1:8085:80"]
    environment:
      # JWT – exact same secret as Django via .env
      JWT_ENABLED: "true"
      JWT_SECRET:  "${ONLYOFFICE_JWT_SECRET}"
      JWT_HEADER:  "Authorization"
      JWT_IN_BODY: "true"

      # Use the dedicated OO DB
      DB_TYPE: "postgres"
      DB_HOST: "onlyoffice_postgres"
      DB_NAME: "${OO_POSTGRES_DB}"
      DB_USER: "${OO_POSTGRES_USER}"
      DB_PWD:  "${OO_POSTGRES_PASSWORD}"

      # Optional behind TLS terminators/proxies
      ONLYOFFICE_HTTPS_HSTS_ENABLED: "false"
      ONLYOFFICE_HTTPS_CHECK_CERTIFICATE: "false"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    depends_on:
      onlyoffice_postgres: { condition: service_healthy }
    networks: [captain-overlay-network]

volumes:
  postgres_data:
  ollama-data:
  milvus-data:
  elasticsearch_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_postgresql:

networks:
  captain-overlay-network:
    external: true

