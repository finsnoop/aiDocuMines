# Unix sockets are inside this database container only (never shared with apps).
local all all trust
# md5 here negotiates SCRAM for SCRAM-stored passwords, preserving old roles
# during credential rotation. New passwords are stored as SCRAM-SHA-256.
hostssl all all 0.0.0.0/0 md5
hostssl all all ::/0 md5
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
